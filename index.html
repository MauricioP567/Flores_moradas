<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un detalle para ti</title>
    <style>
        /* --- CONFIGURACIÓN GENERAL Y FUENTES --- */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #0a0510;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- PÉTALOS CAYENDO DE FONDO --- */
        .petalos-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .petalo {
            position: absolute;
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            border-radius: 50% 0 50% 50%;
            opacity: 0.4;
            animation: caer linear infinite;
        }

        @keyframes caer {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .escena {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            transition: all 1s ease;
        }

        /* --- RAMO DE FLORES (SISTEMA DE CARGA) --- */
        .ramo-contenedor {
            position: relative;
            width: 150px;
            height: 200px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            filter: grayscale(100%) brightness(0.6); 
            transition: filter 0.5s ease, transform 0.2s ease;
        }

        .ramo-contenedor.latido {
            transform: scale(1.1);
        }

        .ramo-svg {
            width: 100%;
            height: 100%;
            drop-shadow: 0 0 15px rgba(148, 0, 211, 0.5);
        }

        /* --- BOTONES --- */
        .zona-botones {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            position: relative;
            height: 150px;
        }

        .btn {
            padding: 15px 35px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-align: center;
            z-index: 20;
        }

        .btn-abrir {
            background: linear-gradient(45deg, #6a0dad, #9400d3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(148, 0, 211, 0.4);
            width: 100%;
            max-width: 350px;
        }

        .btn-abrir:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 30px rgba(148, 0, 211, 0.6);
        }

        .btn-escurridizo {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.15s ease-out, left 0.15s ease-out, top 0.15s ease-out; 
            color: #aaa;
        }

        /* --- CONTENIDO REVELADO (SEGUNDA PANTALLA) --- */
        .contenido-revelado {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
            padding: 20px;
            z-index: 5;
        }

        .contenido-revelado.visible {
            opacity: 1;
            visibility: visible;
        }

        /* --- GALERÍA DE FOTOS (CON VOLTEO) --- */
        .galeria {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        .polaroid {
            width: 200px;
            height: 250px;
            perspective: 1200px;
            cursor: pointer;
            position: relative;
            transform: scale(0) rotate(-10deg);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .polaroid:nth-child(even) {
            transform: scale(0) rotate(8deg);
        }

        .visible .polaroid {
            transform: scale(1) rotate(-5deg);
        }
        .visible .polaroid:nth-child(2) {
            transform: scale(1) rotate(4deg);
            transition-delay: 0.2s;
        }
        .visible .polaroid:nth-child(3) {
            transform: scale(1) rotate(-3deg);
            transition-delay: 0.4s;
        }
        .visible .polaroid:nth-child(4) {
            transform: scale(1) rotate(6deg);
            transition-delay: 0.6s;
        }

        .polaroid-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.85s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .polaroid.flipped .polaroid-inner {
            transform: rotateY(180deg);
        }

        .polaroid-front,
        .polaroid-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Cara frontal (foto) */
        .polaroid-front {
            background: white;
            padding: 10px 10px 40px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .polaroid-front img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 2px;
            filter: grayscale(20%) contrast(110%);
        }

        /* Cinta adhesiva en la parte frontal */
        .polaroid-front::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(2deg);
            width: 60px;
            height: 20px;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 2;
        }

        /* Cara trasera (carta antigua) */
        .polaroid-back {
            background: #f8f1e3; /* tono pergamino */
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 14px;
            border: 1px solid #d4c4a8;
            /* Patrón sutil de pétalos morados */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.18) 0%, transparent 12%),
                radial-gradient(circle at 85% 25%, rgba(148, 0, 211, 0.15) 0%, transparent 14%),
                radial-gradient(circle at 20% 80%, rgba(106, 13, 173, 0.16) 0%, transparent 13%),
                radial-gradient(circle at 80% 75%, rgba(186, 85, 211, 0.14) 0%, transparent 12%),
                radial-gradient(circle at 50% 50%, rgba(147, 112, 219, 0.08) 0%, transparent 40%),
                linear-gradient(145deg, #f8f1e3 0%, #f0e6d2 100%);
            box-shadow: inset 0 0 30px rgba(106, 13, 173, 0.08);
        }

        /* Texto de la carta */
        .carta-texto {
            font-family: 'Cormorant Garamond', 'Playfair Display', serif;
            font-size: 1.05rem;
            font-style: italic;
            font-weight: 500;
            color: #4a2c6a;
            text-align: center;
            line-height: 1.45;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            position: relative;
            z-index: 2;
            padding: 8px 6px;
            max-width: 100%;
        }

        /* Pequeños pétalos decorativos en las esquinas del reverso */
        .polaroid-back::before,
        .polaroid-back::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #ba55d3, #6a0dad 70%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.55;
            pointer-events: none;
        }

        .polaroid-back::before {
            top: 8px;
            left: 8px;
            transform: rotate(-25deg);
        }

        .polaroid-back::after {
            bottom: 8px;
            right: 8px;
            transform: rotate(140deg);
        }

        /* --- TEXTO ROMÁNTICO --- */
        .texto-romantico {
            font-family: 'Playfair Display', serif;
            font-size: 1.55rem;
            text-align: center;
            max-width: 700px;
            line-height: 1.4;
            color: #e6e6fa;
            text-shadow: 0 0 15px rgba(148, 0, 211, 0.6);
            min-height: 100px;
            z-index: 10;
        }

        .texto-romantico::after {
            content: '|';
            animation: parpadear 0.8s infinite;
            color: #9400d3;
        }

        @keyframes parpadear { 50% { opacity: 0; } }

        /* --- JARDÍN INFERIOR --- */
        .jardin-inferior {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 2;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120"><defs><radialGradient id="c1" cx="50%25" cy="50%25" r="50%25"><stop offset="0%25" stop-color="%23ffb703"/><stop offset="100%25" stop-color="%23e09f00"/></radialGradient><radialGradient id="c2" cx="50%25" cy="50%25" r="50%25"><stop offset="0%25" stop-color="%23ffe066"/><stop offset="100%25" stop-color="%23ffb703"/></radialGradient></defs><g transform="translate(25,85)"><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%236a0dad" transform="rotate(0)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%237b1fa2" transform="rotate(45)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%238a2be2" transform="rotate(90)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%239400d3" transform="rotate(135)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%23ba55d3" transform="rotate(180)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%239c27b0" transform="rotate(225)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%237b1fa2" transform="rotate(270)"/><ellipse cx="0" cy="-8" rx="7" ry="11" fill="%236a0dad" transform="rotate(315)"/><circle cx="0" cy="0" r="5" fill="url(%23c1)"/></g><g transform="translate(70,95)"><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%238a2be2" transform="rotate(0)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%239400d3" transform="rotate(30)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%23ba55d3" transform="rotate(60)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%238a2be2" transform="rotate(90)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%239400d3" transform="rotate(120)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%23ba55d3" transform="rotate(150)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%238a2be2" transform="rotate(180)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%239400d3" transform="rotate(210)"/><ellipse cx="0" cy="-10" rx="3.5" ry="12" fill="%23ba55d3" transform="rotate(240)"/><elli             background-repeat: repeat-x;
            background-position: bottom;
            background-size: 200px 120px;
            opacity: 0.95;
            -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
            mask-image: linear-gradient(to top, black 60%, transparent 100%);
        }

        /* --- PARTÍCULAS DE LUZ --- */
        .particula {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px 5px #9400d3;
            pointer-events: none;
            z-index: 2;
            animation: explosion 1.5s ease-out forwards;
        }

        @keyframes explosion {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .texto-romantico { font-size: 1.15rem; padding: 0 15px; }
            .polaroid {
                width: 145px;
                height: 185px;
            }
            .polaroid-front img {
                width: 125px;
                height: 125px;
            }
            .carta-texto {
                font-size: 0.82rem;
                line-height: 1.35;
            }
            .galeria { gap: 12px; }
        }

<body>

    <!-- Fondo animado -->
    <div class="petalos-fondo" id="fondo"></div>

    <!-- Pantalla Inicial (Ramo y Botones) -->
    <div class="escena" id="escena-inicial">
        
        <div class="ramo-contenedor" id="ramo">
            <svg class="ramo-svg" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,150 L50,70 M50,120 C40,120 30,100 25,90 M50,110 C60,110 70,95 75,85 M50,100 C40,100 35,85 30,75 M50,90 C60,90 65,75 70,65" stroke="#2d6a4f" stroke-width="3" fill="none"/>
                <path d="M45,120 Q35,110 40,100 Q50,105 45,120" fill="#40916c"/>
                <path d="M55,100 Q65,90 60,80 Q50,85 55,100" fill="#40916c"/>
                <g id="flores" fill="none">
                    <circle cx="25" cy="90" r="12" fill="#8a2be2" opacity="0" class="flor-item"/>
                    <circle cx="75" cy="85" r="14" fill="#9400d3" opacity="0" class="flor-item"/>
                    <circle cx="30" cy="75" r="10" fill="#6a0dad" opacity="0" class="flor-item"/>
                    <circle cx="70" cy="65" r="15" fill="#ba55d3" opacity="0" class="flor-item"/>
                    <circle cx="50" cy="70" r="18" fill="#8a2be2" opacity="0" class="flor-item"/>
                    <circle cx="25" cy="90" r="4" fill="#ffb703" opacity="0" class="flor-item"/>
                    <circle cx="75" cy="85" r="5" fill="#ffb703" opacity="0" class="flor-item"/>
                    <circle cx="30" cy="75" r="3" fill="#ffb703" opacity="0" class="flor-item"/>
                    <circle cx="70" cy="65" r="5" fill="#ffb703" opacity="0" class="flor-item"/>
                    <circle cx="50" cy="70" r="6" fill="#ffb703" opacity="0" class="flor-item"/>
                </g>
            </svg>
        </div>

        <div class="zona-botones">
            <button class="btn btn-abrir" id="btnCarga" onclick="cargarRamo()">Click aquí si me quieres tanto como yo a ti</button>
            <button class="btn btn-escurridizo" id="btnEsquivar" onmouseover="moverBoton(event)" onclick="moverBoton(event)">Ya no me interesan tus flores feas</button>
        </div>

    </div>

    <!-- Pantalla Revelada (Fotos y Texto) -->
    <div class="contenido-revelado" id="contenido">
        
        <div class="jardin-inferior"></div>

        <div class="galeria">
            <!-- Foto 1 -->
            <div class="polaroid" onclick="this.classList.toggle('flipped')">
                <div class="polaroid-inner">
                    <div class="polaroid-front">

            <div class="polaroid" onclick="this.classList.toggle('flipped')">
                <div class="polaroid-inner">

                    </div>
                    <div class="polaroid-back">

            <div class="polaroid" onclick="this.classList.toggle('flipped')">
                <div class="polaroid-inner">

                <div class="polaroid-inner">
                    <div class="polaroid-front">

                    </div>

        <div class="texto-romantico" id="texto"></div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        // 1. Generar los pétalos de fondo
        const fondo = document.getElementById('fondo');
        for(let i = 0; i < 30; i++) {
            let petalo = document.createElement('div');
            petalo.classList.add('petalo');
            let size = Math.random() * 15 + 10;
            petalo.style.width = size + 'px';
            petalo.style.height = size + 'px';
            petalo.style.left = Math.random() * 100 + 'vw';
            petalo.style.animationDuration = (Math.random() * 5 + 5) + 's';
            petalo.style.animationDelay = Math.random() * 5 + 's';
            fondo.appendChild(petalo);
        }

        // 2. Sistema de carga del ramo (5 clics)
        let clics = 0;
        const maxClics = 5;
        const ramo = document.getElementById('ramo');
        const flores = document.querySelectorAll('.flor-item');
        const btnCarga = document.getElementById('btnCarga');

        function cargarRamo() {
            if (clics >= maxClics) return;

            clics++;

            ramo.classList.add('latido');
            setTimeout(() => ramo.classList.remove('latido'), 200);

            let gris = 100 - (clics * 20);
            ramo.style.filter = `grayscale(${gris}%) brightness(${0.6 + (clics * 0.08)})`;

            let floresPorClic = Math.ceil(flores.length / maxClics);
            for(let i = 0; i < floresPorClic; i++) {
                let index = (clics - 1) * floresPorClic + i;
                if (index < flores.length) {
                    flores[index].style.opacity = '1';
                }
            }

            if (clics === maxClics) {
                btnCarga.innerText = "¡Te quiero mucho!";
                btnCarga.style.background = "linear-gradient(45deg, #d90429, #ff4d6d)";
                btnCarga.disabled = true;
                btnCarga.style.cursor = "default";
                
                setTimeout(abrirRegalo, 600);
            } else {
                btnCarga.innerText = `¡Sigue así! (${clics}/${maxClics})`;
            }
        }

        // 3. Botón escurridizo
        const btnEsquivar = document.getElementById('btnEsquivar');
        const zonaBotones = document.querySelector('.zona-botones');

        function moverBoton(e) {
            if(e) e.preventDefault();
            
            const anchoZona = zonaBotones.clientWidth;
            const altoZona = zonaBotones.clientHeight;

            const randomX = Math.random() * (anchoZona - 150); 
            const randomY = Math.random() * (altoZona - 50);

            btnEsquivar.style.left = `${randomX}px`;
            btnEsquivar.style.top = `${randomY}px`;
            btnEsquivar.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
        }

        // 4. Animación de revelado
        function abrirRegalo() {
            const escenaInicial = document.getElementById('escena-inicial');
            const contenido = document.getElementById('contenido');
            const textoHTML = document.getElementById('texto');

            crearParticulas();

            setTimeout(() => {
                escenaInicial.style.opacity = 0;
            }, 300);

            setTimeout(() => {
                escenaInicial.style.display = 'none';
                contenido.classList.add('visible');
                escribirTexto(textoHTML);
            }, 1500);
        }

        function escribirTexto(elemento) {
            const mensaje = "A veces se me escapan estas fechas especiales pero, quiero que sepas con total certeza que a pesar de no estar tan metido en estas cosas no significa que no me importes. Tú me importas demasiado, tanto que no podía dejar que este día terminara simplemente así, con un  'me se olvidó'. Así que quise construir este espacio especial para ti, donde las flores moradas nunca se marchitan y representan mi total admiración por ti.";
            let i = 0;
            
            setTimeout(() => { elemento.style.setProperty('--cursor', 'none'); }, 6000);

            function escribir() {
                if (i < mensaje.length) {
                    elemento.innerHTML += mensaje.charAt(i);
                    i++;
                    setTimeout(escribir, 70);
                }
            }
            escribir();
        }

        function crearParticulas() {
            const escena = document.getElementById('escena-inicial');
            for(let i = 0; i < 50; i++) {
                let particula = document.createElement('div');
                particula.classList.add('particula');
                
                particula.style.left = '50%';
                particula.style.top = '40%';

                let angulo = Math.random() * Math.PI * 2;
                let distancia = Math.random() * 400 + 100;
                
                let x = Math.cos(angulo) * distancia;
                let y = Math.sin(angulo) * distancia;

                particula.style.setProperty('--x', x + 'px');
                particula.style.setProperty('--y', y + 'px');
                
                particula.style.animationDelay = Math.random() * 0.4 + 's';
                particula.style.animationDuration = (Math.random() * 1 + 1) + 's';

                escena.appendChild(particula);

                setTimeout(() => { particula.remove(); }, 2000);
            }
        }
    </script>
</body>
</html>
